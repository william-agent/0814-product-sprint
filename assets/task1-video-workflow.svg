<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 520" role="img" aria-labelledby="task1-video-workflow-title task1-video-workflow-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="task1-video-workflow-title">財經文章到短影音的五層討論框架</title>
  <desc id="task1-video-workflow-desc">五個可能的討論層次，涵蓋內容意圖、Storyline 與腳本、素材責任、生成修復和 HyperFrames 合成；這不是已拍板的執行流程。</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1280" height="520" fill="#f5f5f5"/>
  <text x="64" y="48" fill="#4f5d75" font-family="'Geist Mono','PingFang TC',monospace" font-size="12" font-weight="500" letter-spacing="2">DISCUSSION FRAMEWORK</text>
  <text x="64" y="92" fill="#2d3142" font-family="'Instrument Serif','PingFang TC',serif" font-size="32">生成下一支影片前，可能要討論的五個層次</text>
  <text x="64" y="128" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="16">這不是執行計畫；步驟、責任與完成條件都還沒有拍板。</text>

  <line x1="256" y1="268" x2="292" y2="268" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <line x1="496" y1="268" x2="532" y2="268" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <line x1="736" y1="268" x2="772" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="976" y1="268" x2="1012" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="64" y="196" width="192" height="144" rx="8" fill="#ffffff" stroke="#bfc0c0"/>
  <text x="80" y="224" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="12" font-weight="600">LAYER 1</text>
  <text x="80" y="264" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="20" font-weight="600">內容意圖</text>
  <text x="80" y="296" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">影片想讓觀眾</text>
  <text x="80" y="316" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">理解什麼？</text>

  <rect x="304" y="196" width="192" height="144" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="320" y="224" fill="#eb6c36" font-family="'Geist Mono',monospace" font-size="12" font-weight="600">LAYER 2</text>
  <text x="320" y="264" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="20" font-weight="600">Storyline ＋ Copy</text>
  <text x="320" y="296" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">內容怎麼呈現？</text>
  <text x="320" y="316" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">腳本怎麼安排？</text>

  <rect x="544" y="196" width="192" height="144" rx="8" fill="#ffffff" stroke="#bfc0c0"/>
  <text x="560" y="224" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="12" font-weight="600">LAYER 3</text>
  <text x="560" y="264" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="20" font-weight="600">素材與製作責任</text>
  <text x="560" y="296" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">哪些要先固定？</text>
  <text x="560" y="316" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">哪些可以生成？</text>

  <rect x="784" y="196" width="192" height="144" rx="8" fill="#ffffff" stroke="#bfc0c0"/>
  <text x="800" y="224" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="12" font-weight="600">LAYER 4</text>
  <text x="800" y="264" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="20" font-weight="600">生成與修復</text>
  <text x="800" y="296" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">角色一致性、局部修復？</text>
  <text x="800" y="316" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">ComfyUI 是否需要？</text>

  <rect x="1024" y="196" width="192" height="144" rx="8" fill="#ffffff" stroke="#bfc0c0"/>
  <text x="1040" y="224" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="12" font-weight="600">LAYER 5</text>
  <text x="1040" y="264" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="20" font-weight="600">HyperFrames 合成</text>
  <text x="1040" y="296" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">哪些字幕、數據與版面</text>
  <text x="1040" y="316" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">交給 HyperFrames？</text>

  <line x1="64" y1="396" x2="1216" y2="396" stroke="rgba(45,49,66,0.12)"/>
  <text x="64" y="432" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="16" font-weight="600">目前只確定：</text>
  <text x="192" y="432" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="16">生成候選片段可以交給 HyperFrames 繼續處理。</text>
  <text x="64" y="468" fill="#7a8399" font-family="'Geist Mono','PingFang TC',monospace" font-size="12">其餘問題仍待討論，不在這張圖中代替決定。</text>
</svg>
