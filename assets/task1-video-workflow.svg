<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 640" role="img" aria-labelledby="task1-video-workflow-svg-title task1-video-workflow-svg-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="task1-video-workflow-svg-title">財經文章到短影音的五層 Workflow</title>
  <desc id="task1-video-workflow-svg-desc">五層流程顯示目前只有素材生成到 HyperFrames 的技術接線完成，下一步應先補齊內容意圖、Storyline 與製作契約。</desc>
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
  </defs>
  <rect width="1280" height="640" fill="#f5f5f5"/>
  <text x="64" y="48" fill="#4f5d75" font-family="'Geist Mono','PingFang TC',monospace" font-size="12" font-weight="500" letter-spacing="2">TASK 1 · WORKFLOW STATUS</text>
  <text x="64" y="92" fill="#2d3142" font-family="'Instrument Serif','PingFang TC',serif" font-size="32">文章到影片不是一個工具，而是五層契約</text>
  <text x="64" y="128" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="16">目前只完成 Layer 4 → 5 的技術接線；下一步先補 Storyline，而不是加更多節點。</text>
  <line x1="256" y1="292" x2="292" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="496" y1="292" x2="532" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="736" y1="292" x2="772" y2="292" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="976" y1="292" x2="1012" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="64" y="204" width="192" height="176" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="80" y="232" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="12" font-weight="600">LAYER 1</text><text x="80" y="272" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="20" font-weight="600">內容意圖</text><text x="80" y="300" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">給誰看？只記住什麼？</text><line x1="80" y1="324" x2="240" y2="324" stroke="rgba(45,49,66,0.12)"/><text x="80" y="348" fill="#7a8399" font-family="'Geist Mono','PingFang TC',monospace" font-size="12">OUTPUT</text><text x="80" y="368" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="12">Content Brief</text>
  <rect x="304" y="204" width="192" height="176" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="320" y="232" fill="#eb6c36" font-family="'Geist Mono',monospace" font-size="12" font-weight="600">LAYER 2 · NEXT</text><text x="320" y="272" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="20" font-weight="600">Storyline ＋ Copy</text><text x="320" y="300" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">怎麼說，才不靠抽籤？</text><line x1="320" y1="324" x2="480" y2="324" stroke="rgba(235,108,54,0.28)"/><text x="320" y="348" fill="#eb6c36" font-family="'Geist Mono','PingFang TC',monospace" font-size="12">OUTPUT</text><text x="320" y="368" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="12">Story Package</text>
  <rect x="544" y="204" width="192" height="176" rx="8" fill="#ffffff" stroke="#bfc0c0"/><text x="560" y="232" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="12" font-weight="600">LAYER 3</text><text x="560" y="272" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="20" font-weight="600">製作責任鎖定</text><text x="560" y="300" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">哪些固定？哪些可生成？</text><line x1="560" y1="324" x2="720" y2="324" stroke="rgba(45,49,66,0.12)"/><text x="560" y="348" fill="#7a8399" font-family="'Geist Mono','PingFang TC',monospace" font-size="12">OUTPUT</text><text x="560" y="368" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="12">Production Contract</text>
  <rect x="784" y="204" width="192" height="176" rx="8" fill="#ececec" stroke="#2d3142"/><text x="800" y="232" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="12" font-weight="600">LAYER 4 · PREFLIGHT ✓</text><text x="800" y="272" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="20" font-weight="600">素材生成與修復</text><text x="800" y="300" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">ComfyUI 主要在這裡</text><line x1="800" y1="324" x2="960" y2="324" stroke="rgba(45,49,66,0.12)"/><text x="800" y="348" fill="#7a8399" font-family="'Geist Mono','PingFang TC',monospace" font-size="12">OUTPUT</text><text x="800" y="368" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="12">可用的生成片段</text>
  <rect x="1024" y="204" width="192" height="176" rx="8" fill="#ececec" stroke="#2d3142"/><text x="1040" y="232" fill="#2d3142" font-family="'Geist Mono',monospace" font-size="12" font-weight="600">LAYER 5 · PREFLIGHT ✓</text><text x="1040" y="272" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="20" font-weight="600">HyperFrames ＋ QA</text><text x="1040" y="300" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">固定字幕、數據與合成</text><line x1="1040" y1="324" x2="1200" y2="324" stroke="rgba(45,49,66,0.12)"/><text x="1040" y="348" fill="#7a8399" font-family="'Geist Mono','PingFang TC',monospace" font-size="12">OUTPUT</text><text x="1040" y="368" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="12">QA 後的完整影片</text>
  <rect x="304" y="404" width="192" height="56" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-dasharray="4 4"/><text x="320" y="428" fill="#eb6c36" font-family="'Geist Mono','PingFang TC',monospace" font-size="12" font-weight="600">下一步</text><text x="320" y="448" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="12">先鎖 4 beats ＋旁白</text>
  <rect x="784" y="476" width="432" height="64" rx="8" fill="#ececec" stroke="rgba(45,49,66,0.20)"/><text x="808" y="504" fill="#2d3142" font-family="'Geist','PingFang TC',sans-serif" font-size="16" font-weight="600">目前只跑通這一段</text><text x="808" y="528" fill="#4f5d75" font-family="'Geist','PingFang TC',sans-serif" font-size="12">生成候選 → 人工選片 → HyperFrames handoff</text>
  <line x1="64" y1="580" x2="1216" y2="580" stroke="rgba(45,49,66,0.12)"/><text x="64" y="608" fill="#7a8399" font-family="'Geist Mono','PingFang TC',monospace" font-size="12">橘色＝現在要補　｜　深色＝preflight 有證據　｜　白色＝尚未鎖定</text>
</svg>
